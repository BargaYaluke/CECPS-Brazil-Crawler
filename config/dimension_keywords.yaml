# 分类阈值
thresholds:
  # primary 维度的归一化置信度低于此值 → 标记为"低置信,建议人工复核"
  # (不影响是否分类,只是个质量标记)
  low_confidence_below: 0.5
  # secondary 维度占比 ≥ 此值才打 secondary 标签
  secondary_min_score: 0.25
