# dimension_keywords.yaml — 六大维度关键词词典
# 用途: src/classifiers/dimension_engine.py 按关键词把招标打到六个维度
# 匹配对象: contratacoes.objeto_compra + informacao_complementar(后续可加 itens.descricao)
# 业务自维护,改这里不改代码。
#
# 匹配规则:关键词与文本都经 normalize(去重音 + casefold + 标点→空格),
# 然后做"包含"匹配。所以 "informática" 会匹配 "INFORMÁTICA" / "informatica"。
# 关键词建议用葡语(PNCP 数据是葡语);中文关键词基本命中不到,留作文档。
#
# weight: 维度权重(命中数 × weight 算得分);默认 1.0。
# 想让某维度更敏感/钝感可调。

