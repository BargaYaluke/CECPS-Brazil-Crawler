# translation_pt_zh.yaml — 葡萄牙语采购术语 → 中文(离线翻译词典)
# 用途: src/enrichers/translate.py 把 objeto_compra(葡语标的)翻成中文梗概
# 由 Claude 基于真实语料(8357 条标的的高频短语/术语)人工编写,不接外部 API。
#
# 匹配机制(见 translate.py):
#   1. 文本先 normalize(转小写 + 去重音符)
#   2. phrases 按顺序逐条整体替换(放最前的最先匹配 → 把长模板句先吃掉)
#   3. terms 按词长降序做整词替换(长词优先,避免被短词截断)
# 这里 key 写自然葡语(可读),加载时自动 normalize。

