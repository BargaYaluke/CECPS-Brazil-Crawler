# settings.yaml — 全局运行时配置(单一事实源)
# 由 src/core/settings.py 加载,所有模块只读此处。
# 敏感字段(DATABASE_URL 等)通过 .env 注入,见 .env.example。

# ─── HTTP 客户端(全局默认) ────────────────────────────────────────────
http:
  base_url: "https://pncp.gov.br"     # 兜底 base_url
  timeout: 30                          # 单次请求超时(秒)
  rate_limit_per_second: 10            # 每秒最大请求数(令牌桶)
  max_retries: 6                       # 指数退避重试次数(base=2s,max=60s,只针对 5xx/429/网络错;429 还会读 Retry-After)
  user_agent: "BrazilProcurementBot/1.0"

# ─── PNCP API(供 fetchers 使用,覆盖 http 默认) ──────────────────────
pncp:
  base_url: "https://pncp.gov.br/api/consulta/v1"
  timeout: 30
  rate_limit_per_sec: 4                # PNCP consulta API 限流较严,放慢到 4 req/s 避免 429(配合 max_retries + Retry-After)
  page_size: 50                        # 每页条数。/contratacoes/* 上限 50(>50 报 400);fetcher 会自动夹取
  # 列表接口(publicacao / atualizacao)的传输方式:
  #   auto    httpx 优先,撞 F5 挑战自动 fallback 真浏览器(默认,F5 已撤时快 5-10x)
  #   httpx   只走 httpx(最快;若 F5 复活会明确报错)
  #   browser 全程真浏览器(最稳;F5 复活时用)
  transport: "auto"

# ─── Compras.gov.br 开放数据 API(dadosabertos,免认证,非 F5) ──────────
# 联邦采购 SIASG 体系:CATMAT/CATSER 目录、供应商(SICAF)、历史成交价、中标结果。
# 用普通 HttpClient(全开放),不走浏览器。
compras_gov:
  base_url: "https://dadosabertos.compras.gov.br"
  timeout: 60                          # 目录全量页多,放宽超时
  rate_limit_per_sec: 8                # 公开 API,温和限流
  page_size: 500                       # 该 API 每页 10~500,取上限以减少请求数

# ─── 富化层(enrichers)外部数据源 ──────────────────────────────────────
enrichment:
  # BRL→CNY 汇率源。注:BCB PTAX 开放 OData 只含 10 种主流货币,**不含 CNY**
  # (2026-05-28 实测),故改用 AwesomeAPI(巴西常用,免认证)。取 BRLCNY.bid。
  fx_brl_cny_url: "https://economia.awesomeapi.com.br/json/last/BRL-CNY"
  # BrasilAPI(CNPJ 机构/供应商画像,免认证)
  brasilapi_base_url: "https://brasilapi.com.br/api"
  rate_limit_per_sec: 3                # BrasilAPI 有限流,温和点

# ─── 翻译(标的葡→中;DeepSeek,OpenAI 兼容)─────────────────────────────
# API key 放 .env 的 DEEPSEEK_API_KEY(不进代码/不提交)。无 key 时自动回退离线词典。
translation:
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"           # 该账号可用:deepseek-v4-flash / deepseek-v4-pro
  api_key_env: "DEEPSEEK_API_KEY"
  batch_size: 20                       # 每次 API 调用翻多少条(整批 JSON 数组返回)
  max_chars: 500                       # 单条标的截断长度(梗概不需要全文法律样板)
  timeout: 60
  rate_limit_per_sec: 3

# ─── 浏览器(用真 Chromium 解 F5 ASM / Cloudflare 等 JS 挑战) ─────────
browser:
  headless: true                       # 生产为 true;本地调试可改 false 看页面
  wait_after_load_ms: 5000             # SPA 加载后等多久(给 JS 挑战留时间)
  navigation_timeout_ms: 60000         # 页面跳转超时(PNCP SPA 有时 30s+ 才 ready)
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  # 解挑战时访问的 URL(SPA 入口),解完拿走 cookies 注入到 httpx
  challenge_url: "https://pncp.gov.br/app/editais"
  # 只保留这些前缀的 cookie 注入 httpx(F5 cookies 都以 TS 开头)
  cookie_name_prefixes: ["TS"]

# ─── 过滤(见 CLAUDE.md 第 5 节) ────────────────────────────────────────
filter:
  # hard_delete: 命中硬过滤直接不入主表,只写 filtered_log(默认)
  # soft_delete: 入主表但 filter_reason 非空,便于业务回看
  mode: "hard_delete"
  # 被过滤记录的审计日志目录(只追加,禁止覆盖)
  filtered_log_dir: "./data/filtered_log"

# ─── 存储 ────────────────────────────────────────────────────────────────
storage:
  # 开发用 SQLite;生产可在 .env 用 DATABASE_URL 覆盖
  database_url: "sqlite:///./data/procurement.db"
  sync_cursor_table: "sync_cursor"     # 增量游标表名

# ─── 日志 ────────────────────────────────────────────────────────────────
logging:
  level: "INFO"                        # DEBUG / INFO / WARNING / ERROR
  json: true                           # 是否输出 JSON 结构化日志
