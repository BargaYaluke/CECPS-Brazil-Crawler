[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brazil-procurement-crawler"
version = "0.1.0"
description = "巴西 PNCP 招投标爬虫(数字经济 / 医疗医药 / 高端制造 / 大宗商贸 / 跨境电商 / 文化体育 六大维度)"
requires-python = ">=3.11"
readme = "CLAUDE.md"
authors = [{ name = "Brazil Procurement Bot" }]

dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "openpyxl>=3.1",
    "pdfplumber>=0.10",
    "apscheduler>=3.10",
    "click>=8.1",
    "playwright>=1.40",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "mypy>=1.7",
    "ruff>=0.1",
]

[project.scripts]
brazil-crawler = "src.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
